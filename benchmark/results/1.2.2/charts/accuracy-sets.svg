<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 650" width="800" height="650" role="img" aria-labelledby="accuracy-sets-t accuracy-sets-d">
<title id="accuracy-sets-t">Words wrong per everyday test set, continuous use (lower is better)</title>
<desc id="accuracy-sets-d">400 clips per set joined by 2 s pauses into one stream, as the app hears speech. URGENT 2024 noisy speech: v3 22.15%, v4 21.49%; Common Voice: v3 17.49%, v4 17.49%; Earnings-22 calls: v3 16.77%, v4 16.26%; AMI meetings: v3 16.41%, v4 15.51%; GigaSpeech podcasts: v3 13.96%, v4 13.95%; VoxPopuli speeches: v3 8.96%, v4 8.90%; LibriSpeech other: v3 7.32%, v4 7.41%; LibriSpeech clean: v3 3.40%, v4 3.28%</desc>
<style>
  .bg{fill:#ffffff} .t1{fill:#0b0b0b} .t2{fill:#52514e} .t3{fill:#6b6a65} .grid{stroke:#e1e0d9} .axis{stroke:#c3c2b7}
  .v3{fill:#eb6834} .v4{fill:#2a78d6}
  @media (prefers-color-scheme: dark){
    .bg{fill:#0d1117} .t1{fill:#f0efec} .t2{fill:#c3c2b7} .t3{fill:#a3a29b} .grid{stroke:#2c2c2a} .axis{stroke:#383835}
    .v3{fill:#d95926} .v4{fill:#3987e5}
  }
  text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
  .title{font-size:16px;font-weight:600} .sub{font-size:12.5px} .lab{font-size:13px} .note{font-size:11.5px}
  .val{font-size:12.5px;font-variant-numeric:tabular-nums} .tick{font-size:11px;font-variant-numeric:tabular-nums}
  rect.hit{fill:transparent} g.bar:hover path{opacity:.85}
</style>
