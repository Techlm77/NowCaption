<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 402" width="800" height="402" role="img" aria-labelledby="memory-t memory-d">
<title id="memory-t">Peak resident memory (lower is better)</title>
<desc id="memory-d">Largest resident set of each test process, with Python; what each one runs is under its name. NowCaption alone: v3 352 MB, v4 331 MB; Eight captioning at once: v3 348 MB, v4 333 MB; Real audio capture: v3 353 MB, v4 336 MB; Sustained real time: v3 353 MB, v4 325 MB</desc>
<style>
  .bg{fill:#ffffff} .t1{fill:#0b0b0b} .t2{fill:#52514e} .t3{fill:#6b6a65} .grid{stroke:#e1e0d9} .axis{stroke:#c3c2b7}
  .v3{fill:#eb6834} .v4{fill:#2a78d6}
  @media (prefers-color-scheme: dark){
    .bg{fill:#0d1117} .t1{fill:#f0efec} .t2{fill:#c3c2b7} .t3{fill:#a3a29b} .grid{stroke:#2c2c2a} .axis{stroke:#383835}
    .v3{fill:#d95926} .v4{fill:#3987e5}
  }
  text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
  .title{font-size:16px;font-weight:600} .sub{font-size:12.5px} .lab{font-size:13px} .note{font-size:11.5px}
  .val{font-size:12.5px;font-variant-numeric:tabular-nums} .tick{font-size:11px;font-variant-numeric:tabular-nums}
  rect.hit{fill:transparent} g.bar:hover path{opacity:.85}
</style>
<rect class="bg" width="800" height="402" rx="8"/>
<text class="title t1" x="20" y="30">Peak resident memory (lower is better)</text>
<text class="sub t2" x="20" y="50">Largest resident set of each test process, with Python; what each one runs is under its name</text>
<rect class="v3" x="20" y="63" width="12" height="12" rx="3"/><text class="lab t1" x="38" y="73.5">v3 (NowCaption 1.2.0 and 1.2.1)</text>
<rect class="v4" x="280.1" y="63" width="12" height="12" rx="3"/><text class="lab t1" x="298.1" y="73.5">v4 (NowCaption 1.2.2)</text>
<line class="grid" x1="290.0" x2="290.0" y1="90" y2="344" stroke-width="1"/><text class="tick t3" x="290.0" y="360" text-anchor="middle">0 MB</text>
<line class="grid" x1="380.0" x2="380.0" y1="90" y2="344" stroke-width="1"/><text class="tick t3" x="380.0" y="360" text-anchor="middle">100 MB</text>
<line class="grid" x1="470.0" x2="470.0" y1="90" y2="344" stroke-width="1"/><text class="tick t3" x="470.0" y="360" text-anchor="middle">200 MB</text>
<line class="grid" x1="560.0" x2="560.0" y1="90" y2="344" stroke-width="1"/><text class="tick t3" x="560.0" y="360" text-anchor="middle">300 MB</text>
<line class="grid" x1="650.0" x2="650.0" y1="90" y2="344" stroke-width="1"/><text class="tick t3" x="650.0" y="360" text-anchor="middle">400 MB</text>
<line class="axis" x1="290" x2="290" y1="90" y2="344" stroke-width="1"/>
<text class="lab t1" x="278" y="120.0" text-anchor="end">NowCaption alone</text>
<text class="note t3" x="278" y="141.0" text-anchor="end">whole caption process, 78 min</text>
<g class="bar"><title>NowCaption alone, v3: 352 MB</title><rect class="hit" x="290" y="105.0" width="316.8" height="18"/><path class="v3" d="M290.0,106.0h312.8a4,4 0 0 1 4,4v8a4,4 0 0 1 -4,4h-312.8z"/></g>
<g class="bar"><title>NowCaption alone, v4: 331 MB</title><rect class="hit" x="290" y="123.0" width="297.9" height="18"/><path class="v4" d="M290.0,124.0h293.9a4,4 0 0 1 4,4v8a4,4 0 0 1 -4,4h-293.9z"/></g>
<text class="val t1" x="616.8" y="127.5">352 MB → <tspan font-weight="600">331 MB</tspan></text>
<text class="lab t1" x="278" y="182.0" text-anchor="end">Eight captioning at once</text>
<text class="note t3" x="278" y="203.0" text-anchor="end">largest of the 8 processes</text>
<g class="bar"><title>Eight captioning at once, v3: 348 MB</title><rect class="hit" x="290" y="167.0" width="313.2" height="18"/><path class="v3" d="M290.0,168.0h309.2a4,4 0 0 1 4,4v8a4,4 0 0 1 -4,4h-309.2z"/></g>
<g class="bar"><title>Eight captioning at once, v4: 333 MB</title><rect class="hit" x="290" y="185.0" width="299.7" height="18"/><path class="v4" d="M290.0,186.0h295.7a4,4 0 0 1 4,4v8a4,4 0 0 1 -4,4h-295.7z"/></g>
<text class="val t1" x="613.2" y="189.5">348 MB → <tspan font-weight="600">333 MB</tspan></text>
<text class="lab t1" x="278" y="244.0" text-anchor="end">Real audio capture</text>
<text class="note t3" x="278" y="265.0" text-anchor="end">capture, recognition and punctuation</text>
<g class="bar"><title>Real audio capture, v3: 353 MB</title><rect class="hit" x="290" y="229.0" width="317.7" height="18"/><path class="v3" d="M290.0,230.0h313.7a4,4 0 0 1 4,4v8a4,4 0 0 1 -4,4h-313.7z"/></g>
<g class="bar"><title>Real audio capture, v4: 336 MB</title><rect class="hit" x="290" y="247.0" width="302.4" height="18"/><path class="v4" d="M290.0,248.0h298.4a4,4 0 0 1 4,4v8a4,4 0 0 1 -4,4h-298.4z"/></g>
<text class="val t1" x="617.7" y="251.5">353 MB → <tspan font-weight="600">336 MB</tspan></text>
<text class="lab t1" x="278" y="306.0" text-anchor="end">Sustained real time</text>
<text class="note t3" x="278" y="327.0" text-anchor="end">speech model only, after 10 min</text>
<g class="bar"><title>Sustained real time, v3: 353 MB</title><rect class="hit" x="290" y="291.0" width="317.7" height="18"/><path class="v3" d="M290.0,292.0h313.7a4,4 0 0 1 4,4v8a4,4 0 0 1 -4,4h-313.7z"/></g>
<g class="bar"><title>Sustained real time, v4: 325 MB</title><rect class="hit" x="290" y="309.0" width="292.5" height="18"/><path class="v4" d="M290.0,310.0h288.5a4,4 0 0 1 4,4v8a4,4 0 0 1 -4,4h-288.5z"/></g>
<text class="val t1" x="617.7" y="313.5">353 MB → <tspan font-weight="600">325 MB</tspan></text>
<text class="note t3" x="20" y="388">The installed app adds GTK and its window on top of this.</text>
</svg>
