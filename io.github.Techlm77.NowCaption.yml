app-id: io.github.Techlm77.NowCaption
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
command: nowcaption
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # Captions are made from desktop audio (the PulseAudio/PipeWire monitor) or the microphone.
  - --socket=pulseaudio
cleanup:
  - /include
  - /lib/pkgconfig
  - /share/gir-1.0
  - '*.a'

modules:
  # Lets the caption window float above other windows on KDE Plasma, Hyprland, Sway, etc.
  - name: gtk4-layer-shell
    buildsystem: meson
    config-opts:
      - -Dexamples=false
      - -Ddocs=false
      - -Dtests=false
      - -Dsmoke-tests=false
      - -Dintrospection=true
      - -Dvapi=false
    sources:
      - type: git
        url: https://github.com/wmww/gtk4-layer-shell.git
        tag: v1.3.0
        commit: 1c963c51514581c41b9bdae08cdf69171265cdda

  # sherpa-onnx (Apache-2.0, bundles ONNX Runtime, MIT) and numpy, as upstream wheels.
  - name: python3-deps
    buildsystem: simple
    build-commands:
      - pip3 install --no-index --no-deps --find-links=. --prefix=/app sherpa-onnx sherpa-onnx-core numpy
    sources:
      - type: file
        only-arches: [x86_64]
        url: https://files.pythonhosted.org/packages/2d/e2/b1af63c1f6a9e0025cbc9aa3b1814ba97ede63db0ad9f297bb9f268fdfc2/sherpa_onnx-1.13.8-cp314-cp314-manylinux2014_x86_64.manylinux_2_17_x86_64.whl
        sha256: 97309e4b5d9850490085da61e35b0fca002a39ec9da93cd9e21d2d0dcc1cc62a
      - type: file
        only-arches: [aarch64]
        url: https://files.pythonhosted.org/packages/4f/9a/51821829b5735b3d7ce607992a62fe93d5f7215cda324c11191c77d49b9b/sherpa_onnx-1.13.8-cp314-cp314-manylinux2014_aarch64.manylinux_2_17_aarch64.whl
        sha256: 45f16c9fabc3d7ce31ba9722ff8196627ddcaa5ffd02413ad0664ad1952ba419
      - type: file
        only-arches: [x86_64]
        url: https://files.pythonhosted.org/packages/b6/ca/e27c1fb5c54b181d4a5450f3d5c789d9da02eb42dc9b20cfdab5dda4c864/sherpa_onnx_core-1.13.8-py3-none-manylinux2014_x86_64.whl
        sha256: 4da90acf435373d7b2ba9cc0be806e7e274d28f63f5780880b5dea6721626e36
      - type: file
        only-arches: [aarch64]
        url: https://files.pythonhosted.org/packages/9c/72/02227b14cd3fb3d504a8814ad144ed321a53331948c893821e02f4abb1d7/sherpa_onnx_core-1.13.8-py3-none-manylinux2014_aarch64.whl
        sha256: a51a03d55c376c32e15dd63ea852236042ba91a5cd73e253bbf7cf21f6582ba9
      - type: file
        only-arches: [x86_64]
        url: https://files.pythonhosted.org/packages/16/d5/928078d2b28f26829b138b4a6c3980045022fb409f570657a224ae60ef4e/numpy-2.5.4-cp314-cp314-manylinux_2_27_x86_64.manylinux_2_28_x86_64.whl
        sha256: d549420b8858885cea8838a727842249218b9c1da24dd517e25c9c7a948310a3
      - type: file
        only-arches: [aarch64]
        url: https://files.pythonhosted.org/packages/63/d6/34b0a2b0741386a63025a65a2c09caaaaaad6d0ca95b66cd65c30dd7fcb5/numpy-2.5.4-cp314-cp314-manylinux_2_27_aarch64.manylinux_2_28_aarch64.whl
        sha256: 4054173604cd8658796053f1f3bc0befb68ec1c0762c57fdad61e199256a8617

  # Speech model: NVIDIA stt_en_fastconformer_hybrid_large_streaming_multi (CC-BY-4.0),
  # exported to ONNX at 80 ms lookahead by tools/export-model.py and attached to a GitHub release.
  # Punctuation/casing model: Edge-Punct-Casing (Apache-2.0), packaged by k2-fsa.
  # Optional music filter: DPDFNet2 speech enhancement by Ceva (Apache-2.0), packaged by k2-fsa.
  - name: models
    buildsystem: simple
    build-commands:
      - install -Dm644 -t /app/share/nowcaption/models/nowcaption-fastconformer-en-80ms-cc-by-v1 asr/tokens.txt asr/encoder.int8.onnx asr/decoder.int8.onnx asr/joiner.int8.onnx asr/README.md
      - install -Dm644 -t /app/share/nowcaption/models/sherpa-onnx-online-punct-en-2024-08-06 punct/model.int8.onnx punct/bpe.vocab punct/README.md
      - install -Dm644 -t /app/share/nowcaption/models/dpdfnet2 filter/dpdfnet2.onnx
    sources:
      - type: archive
        url: https://github.com/Techlm77/NowCaption/releases/download/models-v1/nowcaption-fastconformer-en-80ms-cc-by-v1.tar.bz2
        sha256: 857639f81da8a52110d659f2d1a91bc5c25f0122f46fd3358091096b74a6ce80
        dest: asr
      - type: archive
        url: https://github.com/k2-fsa/sherpa-onnx/releases/download/punctuation-models/sherpa-onnx-online-punct-en-2024-08-06.tar.bz2
        sha256: 9f5e5a72c7d2829635bd074fce92b6bbd5b78da8a52e7ad8ed1be933f366b99d
        strip-components: 2  # entries are ./<dir>/<file>
        dest: punct
      - type: file
        url: https://github.com/k2-fsa/sherpa-onnx/releases/download/speech-enhancement-models/dpdfnet2.onnx
        sha256: ce35d6025fc71df0ef10d1540e1b7916837bbfe5f6896deb744508d2cad487a9
        dest: filter

  - name: nowcaption
    buildsystem: simple
    build-commands:
      - mkdir -p /app/share/nowcaption && cp -r src/nowcaption /app/share/nowcaption/
      - python3 -m compileall -q /app/share/nowcaption/nowcaption
      - install -Dm755 flatpak/nowcaption.sh /app/bin/nowcaption
      - install -Dm644 data/io.github.Techlm77.NowCaption.desktop -t /app/share/applications
      - install -Dm644 data/io.github.Techlm77.NowCaption.metainfo.xml -t /app/share/metainfo
      - install -Dm644 data/icons/io.github.Techlm77.NowCaption.svg -t /app/share/icons/hicolor/scalable/apps
      - install -Dm644 LICENSE -t /app/share/licenses/io.github.Techlm77.NowCaption
      - install -Dm644 MODEL-LICENSES.md -t /app/share/licenses/io.github.Techlm77.NowCaption
    sources:
      # This checkout: the release workflow builds each tagged version from it.
      - type: dir
        path: .
        skip:
          - .venv
          - .cache
          - models
          - benchmark
          - dist
          - build-dir
          - repo
          - .flatpak-builder
