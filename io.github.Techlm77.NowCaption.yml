app-id: io.github.Techlm77.NowCaption
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
command: nowcaption
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # Captions are made from desktop audio (the PulseAudio/PipeWire monitor) or the microphone.
  - --socket=pulseaudio
cleanup:
  - /include
  - /lib/pkgconfig
  - /share/gir-1.0
  - '*.a'

modules:
  # Lets the caption window float above other windows on KDE Plasma, Hyprland, Sway, etc.
  - name: gtk4-layer-shell
    buildsystem: meson
    config-opts:
      - -Dexamples=false
      - -Ddocs=false
      - -Dtests=false
      - -Dsmoke-tests=false
      - -Dintrospection=true
      - -Dvapi=false
    sources:
      - type: git
        url: https://github.com/wmww/gtk4-layer-shell.git
        tag: v1.3.0
        commit: 1c963c51514581c41b9bdae08cdf69171265cdda

  # sherpa-onnx (Apache-2.0, bundles ONNX Runtime, MIT) and numpy, as upstream wheels; for the
  # optional translation to English, CTranslate2 (MIT) and SentencePiece (Apache-2.0).
  - name: python3-deps
    buildsystem: simple
    build-commands:
      - pip3 install --no-index --no-deps --find-links=. --prefix=/app sherpa-onnx sherpa-onnx-core numpy ctranslate2 sentencepiece
    sources:
      - type: file
        only-arches: [x86_64]
        url: https://files.pythonhosted.org/packages/b2/97/db80101f993f6febd1fbf91249cd900fc38af927cd90e04952400296ab45/ctranslate2-4.8.3-cp314-cp314-manylinux_2_27_x86_64.manylinux_2_28_x86_64.whl
        sha256: 7039b9b9f0520a891108b795c7bd960413cd54df9db319f9afc4c164d28336dc
      - type: file
        only-arches: [aarch64]
        url: https://files.pythonhosted.org/packages/eb/4a/735687d9bb5141e2a5ac6531482a4b1de2b06d7320c6f500590bb834b3bf/ctranslate2-4.8.3-cp314-cp314-manylinux_2_27_aarch64.manylinux_2_28_aarch64.whl
        sha256: 9f90e240ccb0b29d1296e435be2b73a915cf5770bf13b12d21d61470d9ce80c0
      - type: file
        only-arches: [x86_64]
        url: https://files.pythonhosted.org/packages/24/b3/718847349da7b25c8220ed86d85b89080af94740b2d87a59198104ae5c51/sentencepiece-0.2.2-cp314-cp314-manylinux_2_27_x86_64.manylinux_2_28_x86_64.whl
        sha256: 8d44b20234905ff022b7d535f79d1f823ad7670c9851cc4f03cdc34787cdb3ab
      - type: file
        only-arches: [aarch64]
        url: https://files.pythonhosted.org/packages/10/ca/1b6c251321901cbf8a2d2e48b8b70eb82a449011b766af52a228d0a90b6b/sentencepiece-0.2.2-cp314-cp314-manylinux_2_27_aarch64.manylinux_2_28_aarch64.whl
        sha256: 1402d8ee36f0d851cea8eee4dbb85fea14643b7503cf4d00d102eec0fe3ca719
      - type: file
        only-arches: [x86_64]
        url: https://files.pythonhosted.org/packages/2d/e2/b1af63c1f6a9e0025cbc9aa3b1814ba97ede63db0ad9f297bb9f268fdfc2/sherpa_onnx-1.13.8-cp314-cp314-manylinux2014_x86_64.manylinux_2_17_x86_64.whl
        sha256: 97309e4b5d9850490085da61e35b0fca002a39ec9da93cd9e21d2d0dcc1cc62a
      - type: file
        only-arches: [aarch64]
        url: https://files.pythonhosted.org/packages/4f/9a/51821829b5735b3d7ce607992a62fe93d5f7215cda324c11191c77d49b9b/sherpa_onnx-1.13.8-cp314-cp314-manylinux2014_aarch64.manylinux_2_17_aarch64.whl
        sha256: 45f16c9fabc3d7ce31ba9722ff8196627ddcaa5ffd02413ad0664ad1952ba419
      - type: file
        only-arches: [x86_64]
        url: https://files.pythonhosted.org/packages/b6/ca/e27c1fb5c54b181d4a5450f3d5c789d9da02eb42dc9b20cfdab5dda4c864/sherpa_onnx_core-1.13.8-py3-none-manylinux2014_x86_64.whl
        sha256: 4da90acf435373d7b2ba9cc0be806e7e274d28f63f5780880b5dea6721626e36
      - type: file
        only-arches: [aarch64]
        url: https://files.pythonhosted.org/packages/9c/72/02227b14cd3fb3d504a8814ad144ed321a53331948c893821e02f4abb1d7/sherpa_onnx_core-1.13.8-py3-none-manylinux2014_aarch64.whl
        sha256: a51a03d55c376c32e15dd63ea852236042ba91a5cd73e253bbf7cf21f6582ba9
      - type: file
        only-arches: [x86_64]
        url: https://files.pythonhosted.org/packages/16/d5/928078d2b28f26829b138b4a6c3980045022fb409f570657a224ae60ef4e/numpy-2.5.4-cp314-cp314-manylinux_2_27_x86_64.manylinux_2_28_x86_64.whl
        sha256: d549420b8858885cea8838a727842249218b9c1da24dd517e25c9c7a948310a3
      - type: file
        only-arches: [aarch64]
