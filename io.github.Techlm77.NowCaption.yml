        sha256: 4054173604cd8658796053f1f3bc0befb68ec1c0762c57fdad61e199256a8617

  # langid.py (BSD-2-Clause) identifies the spoken language from the recognised text, so that
  # translation knows what it is translating from. Only its two source files are needed.
  - name: langid
    buildsystem: simple
    build-commands:
      - install -Dm644 -t "$(python3 -c 'import sysconfig; print(sysconfig.get_path("purelib", vars={"base":"/app"}))')/langid" langid/__init__.py langid/langid.py
    sources:
      - type: archive
        url: https://files.pythonhosted.org/packages/ea/4c/0fb7d900d3b0b9c8703be316fbddffecdab23c64e1b46c7a83561d78bd43/langid-1.1.6.tar.gz
        sha256: 044bcae1912dab85c33d8e98f2811b8f4ff1213e5e9a9e9510137b84da2cb293

  # Speech model: NVIDIA stt_en_fastconformer_hybrid_large_streaming_multi (CC-BY-4.0),
  # exported to ONNX at 80 ms lookahead by tools/export-model.py and attached to a GitHub release.
  # Punctuation/casing model: Edge-Punct-Casing (Apache-2.0), packaged by k2-fsa.
  # Optional music filter: DPDFNet2 speech enhancement by Ceva (Apache-2.0), packaged by k2-fsa.
  # Optional translation to English: NVIDIA Nemotron 3.5 ASR Streaming 0.6B (OpenMDW-1.1),
  # packaged by k2-fsa, and Meta's M2M100 418M (MIT), converted to CTranslate2 int8 by
  # tools/export-translation-model.sh and attached to a GitHub release.
  - name: models
    buildsystem: simple
    build-commands:
      - install -Dm644 -t /app/share/nowcaption/models/nowcaption-fastconformer-en-80ms-cc-by-v1 asr/tokens.txt asr/encoder.int8.onnx asr/decoder.int8.onnx asr/joiner.int8.onnx asr/README.md
      - install -Dm644 -t /app/share/nowcaption/models/sherpa-onnx-online-punct-en-2024-08-06 punct/model.int8.onnx punct/bpe.vocab punct/README.md
      - install -Dm644 -t /app/share/nowcaption/models/dpdfnet2 filter/dpdfnet2.onnx
      - install -Dm644 -t /app/share/nowcaption/models/sherpa-onnx-nemotron-3.5-asr-streaming-0.6b-320ms-int8-2026-06-11 translate-asr/tokens.txt translate-asr/encoder.int8.onnx translate-asr/decoder.int8.onnx translate-asr/joiner.int8.onnx translate-asr/README.md
      - install -Dm644 -t /app/share/nowcaption/models/nowcaption-m2m100-418m-ct2-int8-v1 mt/model.bin mt/config.json mt/shared_vocabulary.json mt/sentencepiece.bpe.model mt/LICENSE mt/README.md
    sources:
      - type: archive
        url: https://github.com/Techlm77/NowCaption/releases/download/models-v1/nowcaption-fastconformer-en-80ms-cc-by-v1.tar.bz2
        sha256: 857639f81da8a52110d659f2d1a91bc5c25f0122f46fd3358091096b74a6ce80
        dest: asr
      - type: archive
        url: https://github.com/k2-fsa/sherpa-onnx/releases/download/punctuation-models/sherpa-onnx-online-punct-en-2024-08-06.tar.bz2
        sha256: 9f5e5a72c7d2829635bd074fce92b6bbd5b78da8a52e7ad8ed1be933f366b99d
        strip-components: 2  # entries are ./<dir>/<file>
        dest: punct
      - type: file
        url: https://github.com/k2-fsa/sherpa-onnx/releases/download/speech-enhancement-models/dpdfnet2.onnx
        sha256: ce35d6025fc71df0ef10d1540e1b7916837bbfe5f6896deb744508d2cad487a9
        dest: filter
      - type: archive
        url: https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/sherpa-onnx-nemotron-3.5-asr-streaming-0.6b-320ms-int8-2026-06-11.tar.bz2
        sha256: 5f311142337a5c161e92d49f7a3009d8607d3836f39d610bff5307c74d1d2c53
        dest: translate-asr
      - type: archive
        url: https://github.com/Techlm77/NowCaption/releases/download/translation-models-v1/nowcaption-m2m100-418m-ct2-int8-v1.tar.bz2
        sha256: 7227c24af6a3666ee243e51562aa24153840f3bea5d1f41d413a1557b7ed1f2a
        dest: mt

  - name: nowcaption
    buildsystem: simple
    build-commands:
      - mkdir -p /app/share/nowcaption && cp -r src/nowcaption /app/share/nowcaption/
      - python3 -m compileall -q /app/share/nowcaption/nowcaption
      - install -Dm755 flatpak/nowcaption.sh /app/bin/nowcaption
      - install -Dm644 data/io.github.Techlm77.NowCaption.desktop -t /app/share/applications
      - install -Dm644 data/io.github.Techlm77.NowCaption.metainfo.xml -t /app/share/metainfo
      - install -Dm644 data/icons/io.github.Techlm77.NowCaption.svg -t /app/share/icons/hicolor/scalable/apps
      - install -Dm644 LICENSE -t /app/share/licenses/io.github.Techlm77.NowCaption
      - install -Dm644 MODEL-LICENSES.md -t /app/share/licenses/io.github.Techlm77.NowCaption
      - install -Dm644 licenses/OpenMDW-1.1.txt -t /app/share/licenses/io.github.Techlm77.NowCaption
      - install -Dm644 licenses/OpenMDW-1.1.txt /app/share/nowcaption/models/sherpa-onnx-nemotron-3.5-asr-streaming-0.6b-320ms-int8-2026-06-11/LICENSE
    sources:
      # This checkout: the release workflow builds each tagged version from it.
      - type: dir
        path: .
        skip:
          - .venv
          - .cache
          - models
          - benchmark
          - dist
          - build-dir
          - repo
          - .flatpak-builder
