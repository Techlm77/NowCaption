name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  reliability:
    # The core tests (tests/run.py without --gui): the engine, the application's logic and the
    # scripts, with fake models and a fake GStreamer. They need only NumPy, so they run on every
    # supported Python.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ['3.10', '3.12', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install 'numpy>=2'
      - run: python tests/run.py
      - run: python -m compileall -q src tests benchmark tools
      - run: for script in tools/*.sh tests/*.sh flatpak/*.sh; do sh -n "$script"; done

  app:
    # The GUI tests (tests/run.py --gui): the real application, and its windows under Xvfb, with
    # the system's PyGObject, GTK 4 and libadwaita.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-gi python3-gi-cairo python3-numpy \
            gir1.2-gtk-4.0 gir1.2-adw-1 gir1.2-gstreamer-1.0 gir1.2-gst-plugins-base-1.0 \
            python3-yaml dbus xvfb xauth
      - run: /usr/bin/python3 tests/run.py --gui

  lint:
    # Ruff at a pinned version (the rules are in pyproject.toml; 0.17.4 is also Arch's package).
    # tests/ joins this list after its own cleanup.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.14'
      - run: python -m pip install ruff==0.17.4
      - run: ruff check --output-format=github src benchmark tools
