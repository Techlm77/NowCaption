name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  reliability:
    # Worker, capture, transcript and setup-script tests with fake models and a fake
    # GStreamer: they need only NumPy, so they run on every supported Python.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ['3.10', '3.12', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install 'numpy>=2'
      - run: PYTHONPATH=src python tests/test_reliability.py
      - run: PYTHONPATH=src python tests/test_regressions.py
      - run: PYTHONPATH=src python tests/test_fixes_104.py
      - run: PYTHONPATH=src python tests/test_fixes_112.py
      - run: PYTHONPATH=src python tests/test_fixes_113.py
      - run: PYTHONPATH=src python tests/test_fixes_114.py
      - run: python tests/test_version.py
      - run: python -m compileall -q src tests benchmark tools
      - run: for script in tools/*.sh tests/*.sh flatpak/*.sh; do sh -n "$script"; done

  app:
    # Application logic plus real GTK window construction under Xvfb.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-gi python3-gi-cairo python3-numpy \
            gir1.2-gtk-4.0 gir1.2-adw-1 gir1.2-gstreamer-1.0 gir1.2-gst-plugins-base-1.0 \
            xvfb xauth
      - run: NOWCAPTION_REQUIRE_GUI_TESTS=1 PYTHONPATH=src /usr/bin/python3 tests/test_app.py
      - run: xvfb-run -a env NOWCAPTION_REQUIRE_GUI_TESTS=1 PYTHONPATH=src /usr/bin/python3 tests/test_window.py
