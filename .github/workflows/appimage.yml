name: AppImage
# Builds the AppImage for x86_64 and aarch64 (tools/build-appimage.sh, in a clean Ubuntu 24.04
# container) for every release tag, and attaches it with the .zsync file that AppImage updaters
# read to the release. Run it by hand with a tag to add AppImages to an existing release: the
# build tools come from the branch it runs on, NowCaption itself from the tag.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag, for example v1.1.7
        required: true
permissions:
  contents: read
env:
  TAG: ${{ inputs.tag || github.ref_name }}
jobs:
  build:
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    container:
      image: ubuntu:24.04
    steps:
      - run: apt-get update -qq && apt-get install -y -qq --no-install-recommends git ca-certificates >/dev/null
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Use the tag's NowCaption
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git fetch --depth 1 origin "refs/tags/$TAG:refs/tags/$TAG"
          git checkout "$TAG" -- src data pyproject.toml LICENSE MODEL-LICENSES.md
      - run: tools/build-appimage.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: appimage-${{ matrix.arch }}
          path: dist/NowCaption-*.AppImage*
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: appimage-*
          merge-multiple: true
      - run: |
          # The Flatpak workflow may be creating the same release at the same moment.
          gh release view "$TAG" >/dev/null 2>&1 ||
            gh release create "$TAG" --title "NowCaption ${TAG#v}" --notes "NowCaption ${TAG#v}" ||
            gh release view "$TAG" >/dev/null
          gh release upload "$TAG" NowCaption-*.AppImage NowCaption-*.AppImage.zsync --clobber
