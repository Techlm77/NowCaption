name: Flatpak repo
# Builds the Flatpak for x86_64 and aarch64 on every release tag and publishes one signed
# Flatpak repository to GitHub Pages (https://techlm77.github.io/NowCaption/), so installs
# get updates with `flatpak update`. Release tags also get a .flatpak file per architecture.
# Needs the FLATPAK_GPG_PRIVATE_KEY secret (an armored GPG private key).
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: flatpak-repo
  cancel-in-progress: false
env:
  APP_ID: io.github.Techlm77.NowCaption
  REPO_URL: https://techlm77.github.io/NowCaption/
jobs:
  build:
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Import signing key
        env:
          KEY: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}
        run: |
          test -n "$KEY" || { echo "::error::FLATPAK_GPG_PRIVATE_KEY secret is not set"; exit 1; }
          printf '%s\n' "$KEY" | gpg --batch --import
          echo "GPG_KEY=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/{print $10; exit}')" >> "$GITHUB_ENV"
      - name: Build and sign
        run: |
          flatpak remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak-builder --disable-rofiles-fuse --install-deps-from=flathub --force-clean \
            --gpg-sign="$GPG_KEY" --repo=repo build-dir $APP_ID.yml
      - name: Make the .flatpak file
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml)
          gpg --export "$GPG_KEY" > repo-key.gpg
          # A bundle installed from this file adds the repository, so it updates too.
          flatpak build-bundle --repo-url=$REPO_URL --gpg-keys=repo-key.gpg \
            --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo \
            repo NowCaption-$version-${{ matrix.arch }}.flatpak $APP_ID master
          tar cf repo-${{ matrix.arch }}.tar repo
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: flatpak-${{ matrix.arch }}
          path: |
            repo-${{ matrix.arch }}.tar
            NowCaption-*.flatpak
          retention-days: 7

  publish:
    # Only release tags reach the repository; a manual run on a branch just builds the files.
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: flatpak-*
          merge-multiple: true
      - name: Import signing key
        env:
          KEY: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}
        run: |
          printf '%s\n' "$KEY" | gpg --batch --import
          echo "GPG_KEY=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/{print $10; exit}')" >> "$GITHUB_ENV"
      - name: Merge both architectures into one repo
        run: |
          mkdir x86_64 aarch64
          tar xf repo-x86_64.tar -C x86_64 && tar xf repo-aarch64.tar -C aarch64
          mv x86_64/repo repo
          (cd aarch64/repo/refs/heads && find . -type f | sed 's|^\./||') | grep -v '^appstream' |
            while read -r ref; do
            flatpak build-commit-from --src-repo=aarch64/repo --gpg-sign="$GPG_KEY" \
              --no-update-summary repo "$ref"
          done
          flatpak build-update-repo --gpg-sign="$GPG_KEY" --title=NowCaption \
            --default-branch=master repo
          rm -rf repo/tmp
      - name: Write install files
        run: |
          key=$(gpg --export "$GPG_KEY" | base64 -w0)
          cat > repo/nowcaption.flatpakrepo <<EOF
          [Flatpak Repo]
          Title=NowCaption
          Url=$REPO_URL
          Homepage=https://github.com/Techlm77/NowCaption
          Comment=On-device live captions for Linux
          GPGKey=$key
          EOF
          cat > repo/nowcaption.flatpakref <<EOF
          [Flatpak Ref]
          Name=$APP_ID
          Branch=master
          Title=NowCaption
          Url=$REPO_URL
          SuggestRemoteName=nowcaption
          RuntimeRepo=https://dl.flathub.org/repo/flathub.flatpakrepo
          IsRuntime=false
          GPGKey=$key
          EOF
          cat > repo/index.html <<EOF
          <!doctype html><meta charset="utf-8"><title>NowCaption Flatpak repository</title>
          <p>This is the Flatpak repository for <a href="https://github.com/Techlm77/NowCaption">NowCaption</a> (x86_64 and aarch64).
          <p>Install: <code>flatpak install --user --from ${REPO_URL}nowcaption.flatpakref</code>
          EOF
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: repo

  deploy:
    if: startsWith(github.ref, 'refs/tags/')
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1

  release:
    # Attach the .flatpak files to the GitHub release for this tag, creating it if needed.
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: flatpak-*
          merge-multiple: true
      - run: |
          gh release view "$TAG" >/dev/null 2>&1 ||
            gh release create "$TAG" --title "NowCaption ${TAG#v}" --notes "NowCaption ${TAG#v}"
          gh release upload "$TAG" NowCaption-*.flatpak --clobber
